<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streaming Card Maker</title>
<style>
:root{--panel:#15171b;--line:#2a2d33;--text:#f5f6f8;--muted:#9399a3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0c0e;color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.panel{padding:20px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;max-height:100vh;position:sticky;top:0}.head{display:flex;justify-content:space-between;align-items:start;gap:10px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#aaa}.head h1{margin:5px 0 14px;font-size:22px}.group{border-top:1px solid var(--line);padding:15px 0}.group h2{font-size:13px;margin:0 0 11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}label{display:flex;flex-direction:column;gap:6px;color:#bdc2ca;font-size:12px;margin-bottom:10px}input[type=text],textarea,select{width:100%;padding:9px 10px;border:1px solid #343941;border-radius:7px;background:#101216;color:#fff;outline:none}textarea{min-height:135px;resize:vertical;line-height:1.5}input[type=range]{width:100%;accent-color:#ddd}.upload{display:block;text-align:center;border:1px dashed #4b515a;border-radius:9px;padding:11px;margin-bottom:9px;cursor:pointer;font-size:12px;font-weight:700}.upload input{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:8px 10px;background:#262a31;color:#fff;cursor:pointer}.btn.danger{background:#402126}.primary{width:100%;background:#fff;color:#111;font-weight:800;padding:11px}.hint{color:#858b94;font-size:11px;line-height:1.5;margin:7px 0 0}
.stageWrap{min-width:0;padding:18px}.toolbar{display:flex;justify-content:space-between;color:#8f959d;font-size:12px;padding:0 4px 8px}.stageFrame{border:1px solid #22262d;border-radius:12px;padding:18px;min-height:calc(100vh - 66px);display:flex;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(circle,#181b20,#0b0c0e 70%)}
.card{position:relative;width:1200px;height:900px;flex:none;overflow:hidden;background:#111;transform-origin:center}.bg{position:absolute;inset:-12%;background:linear-gradient(135deg,#151515,#454545);background-size:cover;background-position:50% 50%;will-change:transform,filter}.shade{position:absolute;inset:0;background:rgba(0,0,0,.45)}.vignette{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.76),rgba(0,0,0,.18) 52%,rgba(0,0,0,.18)),linear-gradient(180deg,transparent 0 40%,rgba(0,0,0,.12) 55%,rgba(5,5,5,.82) 82%,#111 100%)}.close{position:absolute;right:24px;top:18px;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:34px;font-weight:200;background:rgba(0,0,0,.25)}
.hero{position:absolute;left:64px;top:390px;width:540px}.logoText{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1}.logoImg{display:block;max-width:100%;width:42%;max-height:180px;object-fit:contain;object-position:left bottom}.hide{display:none!important}.actions{display:flex;align-items:center;gap:13px;margin-top:20px}.play{height:56px;padding:0 23px;border:0;border-radius:7px;background:#fff;color:#111;display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}.tri{width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:19px solid #111}.round{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,20,20,.2);color:#fff;font-size:31px}.round.heart{font-size:27px}
.tagline{position:absolute;left:720px;top:350px;width:300px;font-size:18px;line-height:1.75;font-weight:800;text-shadow:0 2px 6px #000}.meta{position:absolute;left:64px;bottom:105px;width:730px}.metaTop{display:flex;gap:13px;align-items:center;color:#d2d4d8;font-size:18px;margin-bottom:13px}.quality{font-size:13px;border:1px solid #d4d6da;border-radius:3px;padding:1px 5px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.chip{height:34px;min-width:34px;padding:0 8px;display:grid;place-items:center;background:#050505;border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:14px}.chip.age{background:#d86b31;font-weight:800}.synopsis{margin:0;max-width:760px;font-size:18px;line-height:1.62;font-weight:600;color:#f2f2f2;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.info{position:absolute;right:62px;bottom:105px;width:350px;font-size:16px;line-height:1.6}.info p{margin:0 0 17px;color:#92969c}.info span{color:#72767c}.info strong{color:#f5f5f5;font-weight:600}
@media(max-width:1050px){.app{grid-template-columns:1fr}.panel{position:relative;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.stageFrame{min-height:auto}}@media(max-width:620px){.panel{padding:14px}.grid2,.grid3{grid-template-columns:1fr}.stageWrap{padding:8px}.stageFrame{padding:8px}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="head"><div><div class="eyebrow">STREAMING CARD MAKER</div><h1>상세 화면 메이커</h1></div><button class="btn" id="resetBtn">초기화</button></div>

    <section class="group"><h2>이미지</h2>
      <label class="upload">배경 이미지 업로드<input id="bgUpload" type="file" accept="image/*"></label>
      <label class="upload">제목 로고 이미지 업로드<input id="logoUpload" type="file" accept="image/*"></label>
      <button class="btn" id="removeLogoBtn">로고 제거</button>
    </section>

    <section class="group grid2">
      <label>배경 X<input id="bgX" type="range" min="0" max="100" value="50"></label>
      <label>배경 Y<input id="bgY" type="range" min="0" max="100" value="50"></label>
      <label>배경 확대<input id="bgZoom" type="range" min="100" max="180" value="100"></label>
      <label>어둡기<input id="overlay" type="range" min="0" max="85" value="45"></label>
      <label>블러<input id="blur" type="range" min="0" max="12" value="0"></label>
      <label>로고 크기<input id="logoSize" type="range" min="18" max="70" value="42"></label>
      <label>로고+버튼 Y<input id="heroY" type="range" min="250" max="520" value="390"></label>
      <label>캐치프레이즈 Y<input id="tagY" type="range" min="250" max="520" value="350"></label>
    </section>

    <section class="group"><h2>기본 정보</h2>
      <label>캐치프레이즈<input id="tagline" type="text" value="내 인생의 행운은 전부 요리 덕에 찾아왔다"></label>
      <div class="grid3"><label>연도<input id="year" type="text" value="2014"></label><label>러닝타임<input id="runtime" type="text" value="1시간 54분"></label><label>화질<input id="quality" type="text" value="HD"></label></div>
      <div class="grid2"><label>연령 등급<input id="ageRating" type="text" value="15"></label><label>하단 배지/로고<input id="extraBadges" type="text" value="?,⌁,♬,◉,●"></label></div>
      <div class="hint" style="margin:-3px 0 10px">배지는 쉼표로 구분. 예: 폭력,공포,음악</div>
      <label>줄거리<textarea id="synopsis" rows="7">창의력이 지글지글 끓어오르는 셰프. 똑같은 메뉴만 고집하는 주인과 지지고 볶은 후 허름한 푸드트럭을 차리면서 맛깔나는 좌충우돌 여정에 오른다. 낡은 트럭과 함께 길 위를 떠돌며 새로운 맛과 사람, 실패와 우정을 차곡차곡 끓여내는 동안 한때 잃어버렸던 자존감과 열정도 다시 살아난다. 배고플 땐 보지 말 것!</textarea></label>
    </section>

    <section class="group"><h2>오른쪽 정보</h2>
      <label>출연<input id="cast" type="text" value="존 파브로, 소피아 베르가라, 존 레귀자모"></label>
      <label>장르<input id="genres" type="text" value="미국 작품, 코미디 영화, 인디 영화"></label>
      <label>작품 특징<input id="features" type="text" value="힐링, 진심이 통하는, 진심 어린"></label>
    </section>

    <section class="group"><h2>프리셋</h2>
      <div class="grid2"><label>프리셋 이름<input id="presetName" type="text" placeholder="예: 카인"></label><label>저장된 프리셋<select id="presetSelect"><option value="">프리셋 선택</option></select></label></div>
      <div class="row"><button class="btn" id="savePresetBtn">저장</button><button class="btn" id="loadPresetBtn">불러오기</button><button class="btn danger" id="deletePresetBtn">삭제</button></div>
      <p class="hint">같은 브라우저에 저장돼. 이미지가 너무 크면 텍스트/설정만 저장돼.</p>
    </section>

    <section class="group"><h2>출력</h2>
      <div class="grid2"><label>비율<select id="ratio"><option value="1200x900">4:3 (1200×900)</option><option value="1600x900">16:9 (1600×900)</option><option value="1080x1350">4:5 (1080×1350)</option><option value="904x739">레퍼런스 (904×739)</option></select></label><label>파일명<input id="filename" type="text" value="streaming-card"></label></div>
      <button class="btn primary" id="exportBtn">PNG로 저장</button>
    </section>
  </aside>

  <main class="stageWrap"><div class="toolbar"><span>실시간 미리보기</span><span id="sizeLabel">1200 × 900</span></div><div class="stageFrame">
    <article class="card" id="card">
      <div class="bg" id="bg"></div><div class="shade" id="shade"></div><div class="vignette"></div><div class="close">×</div>
      <div class="hero" id="hero"><div class="logoText" id="logoText">TITLE LOGO</div><img class="logoImg hide" id="logoImg" alt="logo"><div class="actions"><button class="play"><span class="tri"></span>재생</button><button class="round">＋</button><button class="round heart">♡</button></div></div>
      <div class="tagline" id="taglineOut"></div>
      <div class="meta"><div class="metaTop"><span id="yearOut"></span><span id="runtimeOut"></span><span class="quality" id="qualityOut"></span></div><div class="badges" id="badges"></div><p class="synopsis" id="synopsisOut"></p></div>
      <div class="info"><p><span>출연:</span> <strong id="castOut"></strong></p><p><span>장르:</span> <strong id="genresOut"></strong></p><p><span>작품 특징:</span> <strong id="featuresOut"></strong></p></div>
    </article>
  </div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), PRESET='streamingCardMakerV3';
const st={bgData:'',logoData:'',ratio:'1200x900'};
const defaults={tagline:'내 인생의 행운은 전부 요리 덕에 찾아왔다',year:'2014',runtime:'1시간 54분',quality:'HD',ageRating:'15',extraBadges:'?,⌁,♬,◉,●',synopsis:'창의력이 지글지글 끓어오르는 셰프. 똑같은 메뉴만 고집하는 주인과 지지고 볶은 후 허름한 푸드트럭을 차리면서 맛깔나는 좌충우돌 여정에 오른다. 낡은 트럭과 함께 길 위를 떠돌며 새로운 맛과 사람, 실패와 우정을 차곡차곡 끓여내는 동안 한때 잃어버렸던 자존감과 열정도 다시 살아난다. 배고플 땐 보지 말 것!',cast:'존 파브로, 소피아 베르가라, 존 레귀자모',genres:'미국 작품, 코미디 영화, 인디 영화',features:'힐링, 진심이 통하는, 진심 어린'};

function syncText(id){const out=$(id+'Out');if(out)out.textContent=$(id).value}
['year','runtime','quality','cast','genres','features'].forEach(id=>{$(id).addEventListener('input',()=>syncText(id));syncText(id)});
function syncTag(){const t=$('tagline').value.trim(); if(t.length>18){let m=Math.ceil(t.length*.48),i=t.lastIndexOf(' ',m);if(i<4)i=t.indexOf(' ',m);$('taglineOut').innerHTML=i>0?esc(t.slice(0,i))+'<br>'+esc(t.slice(i+1)):esc(t)}else $('taglineOut').textContent=t}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('tagline').addEventListener('input',syncTag);syncTag();
$('synopsis').addEventListener('input',()=>$('synopsisOut').textContent=$('synopsis').value);$('synopsisOut').textContent=$('synopsis').value;
function badges(){const box=$('badges');box.innerHTML='';const age=document.createElement('span');age.className='chip age';age.textContent=$('ageRating').value||'15';box.appendChild(age);$('extraBadges').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6).forEach(x=>{const s=document.createElement('span');s.className='chip';s.textContent=x;box.appendChild(s)})}
$('ageRating').addEventListener('input',badges);$('extraBadges').addEventListener('input',badges);badges();

function file(input,cb){input.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)})}
file($('bgUpload'),d=>{st.bgData=d;$('bg').style.backgroundImage=`url("${d}")`});
file($('logoUpload'),d=>{st.logoData=d;$('logoImg').src=d;$('logoImg').classList.remove('hide');$('logoText').classList.add('hide')});
$('removeLogoBtn').onclick=()=>{st.logoData='';$('logoImg').src='';$('logoImg').classList.add('hide');$('logoText').classList.remove('hide');$('logoUpload').value=''};

function range(id,fn){$(id).addEventListener('input',()=>fn(+$ (id).value));fn(+$ (id).value)}
range('bgX',()=>bgStyle());range('bgY',()=>bgStyle());range('bgZoom',()=>bgStyle());range('blur',()=>bgStyle());
range('overlay',v=>$('shade').style.background=`rgba(0,0,0,${v/100})`);
range('logoSize',v=>$('logoImg').style.width=v+'%');
range('heroY',v=>$('hero').style.top=v+'px');
range('tagY',v=>$('taglineOut').style.top=v+'px');
function bgStyle(){$('bg').style.backgroundPosition=$('bgX').value+'% '+$('bgY').value+'%';$('bg').style.transform=`scale(${$('bgZoom').value/100})`;$('bg').style.filter=`blur(${$('blur').value}px)`}

function ratio(v){st.ratio=v;const [w,h]=v.split('x').map(Number);$('card').style.width=w+'px';$('card').style.height=h+'px';$('sizeLabel').textContent=w+' × '+h;fit()}
$('ratio').addEventListener('change',()=>ratio($('ratio').value));
function fit(){const frame=document.querySelector('.stageFrame'),card=$('card'),[w,h]=st.ratio.split('x').map(Number);const sc=Math.min(Math.max(250,frame.clientWidth-40)/w,Math.max(250,window.innerHeight-110)/h,1);card.style.transform=`scale(${sc})`;card.style.margin=`${-(h*(1-sc))/2}px ${-(w*(1-sc))/2}px`}
window.addEventListener('resize',fit);

function collect(){return {tagline:$('tagline').value,year:$('year').value,runtime:$('runtime').value,quality:$('quality').value,ageRating:$('ageRating').value,extraBadges:$('extraBadges').value,synopsis:$('synopsis').value,cast:$('cast').value,genres:$('genres').value,features:$('features').value,ratio:$('ratio').value,filename:$('filename').value,bgX:+$('bgX').value,bgY:+$('bgY').value,bgZoom:+$('bgZoom').value,overlay:+$('overlay').value,blur:+$('blur').value,logoSize:+$('logoSize').value,heroY:+$('heroY').value,tagY:+$('tagY').value,bgData:st.bgData,logoData:st.logoData}}
function apply(d){d={...defaults,...d};['tagline','year','runtime','quality','ageRating','extraBadges','synopsis','cast','genres','features','filename'].forEach(id=>{if($(id)&&d[id]!=null)$(id).value=d[id]});['bgX','bgY','bgZoom','overlay','blur','logoSize','heroY','tagY'].forEach(id=>{if(d[id]!=null)$(id).value=d[id]});if(d.ratio)$('ratio').value=d.ratio;if(d.bgData){st.bgData=d.bgData;$('bg').style.backgroundImage=`url("${d.bgData}")`}if(d.logoData){st.logoData=d.logoData;$('logoImg').src=d.logoData;$('logoImg').classList.remove('hide');$('logoText').classList.add('hide')}else if(d.logoData===''){st.logoData='';$('logoImg').classList.add('hide');$('logoText').classList.remove('hide')}['year','runtime','quality','cast','genres','features'].forEach(syncText);syncTag();$('synopsisOut').textContent=$('synopsis').value;badges();bgStyle();$('shade').style.background=`rgba(0,0,0,${$('overlay').value/100})`;$('logoImg').style.width=$('logoSize').value+'%';$('hero').style.top=$('heroY').value+'px';$('taglineOut').style.top=$('tagY').value+'px';ratio($('ratio').value)}
function map(){try{return JSON.parse(localStorage.getItem(PRESET)||'{}')}catch(e){return {}}}function saveMap(m){localStorage.setItem(PRESET,JSON.stringify(m))}function refresh(sel=''){const s=$('presetSelect'),m=map();s.innerHTML='<option value="">프리셋 선택</option>';Object.keys(m).sort().forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;o.selected=n===sel;s.appendChild(o)})}
$('savePresetBtn').onclick=()=>{const n=$('presetName').value.trim()||prompt('프리셋 이름을 입력해줘.');if(!n)return;const m=map(),p=collect();try{m[n]=p;saveMap(m);refresh(n);$('presetName').value=n;alert('프리셋 저장 완료!')}catch(e){try{m[n]={...p,bgData:'',logoData:''};saveMap(m);refresh(n);alert('이미지가 커서 텍스트/설정만 저장했어.')}catch(e2){alert('프리셋 저장에 실패했어.')}}};
$('loadPresetBtn').onclick=()=>{const n=$('presetSelect').value;if(!n)return alert('프리셋을 선택해줘.');apply(map()[n]||{})};$('deletePresetBtn').onclick=()=>{const n=$('presetSelect').value;if(!n)return alert('삭제할 프리셋을 선택해줘.');const m=map();delete m[n];saveMap(m);refresh()};$('presetSelect').onchange=()=>{if($('presetSelect').value)$('presetName').value=$('presetSelect').value};
$('resetBtn').onclick=()=>{apply({...defaults,filename:'streaming-card',ratio:'1200x900',bgX:50,bgY:50,bgZoom:100,overlay:45,blur:0,logoSize:42,heroY:390,tagY:350,bgData:'',logoData:''});$('bg').style.backgroundImage='linear-gradient(135deg,#151515,#454545)';st.bgData='';st.logoData='';$('bgUpload').value='';$('logoUpload').value=''};
$('exportBtn').onclick=async()=>{if(!window.html2canvas)return alert('PNG 저장 라이브러리를 불러오지 못했어.');const b=$('exportBtn'),old=b.textContent,card=$('card'),tr=card.style.transform,mg=card.style.margin;b.disabled=true;b.textContent='이미지 만드는 중…';card.style.transform='none';card.style.margin='0';try{const c=await html2canvas(card,{backgroundColor:'#111',scale:1,useCORS:true,logging:false});const a=document.createElement('a');a.download=(($('filename').value||'streaming-card').replace(/[\\/:*?"<>|]+/g,'_'))+'.png';a.href=c.toDataURL('image/png');a.click()}catch(e){console.error(e);alert('PNG 저장 중 오류가 났어.')}finally{card.style.transform=tr;card.style.margin=mg;b.disabled=false;b.textContent=old}};
refresh();ratio('1200x900');setTimeout(fit,50);
})();
</script>
</body>
</html>
