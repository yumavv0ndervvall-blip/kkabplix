<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Streaming Detail Card Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="panel">
      <div class="panel-head">
        <div>
          <div class="eyebrow">STREAMING CARD MAKER</div>
          <h1>상세 화면 메이커</h1>
        </div>
        <button id="resetBtn" class="ghost-btn" type="button">초기화</button>
      </div>

      <section class="control-group">
        <h2>이미지</h2>
        <label class="upload-box">
          <span>배경 이미지 업로드</span>
          <input id="bgUpload" type="file" accept="image/*" />
        </label>
        <label class="upload-box">
          <span>제목 로고 이미지 업로드</span>
          <input id="logoUpload" type="file" accept="image/*" />
        </label>
        <button id="removeLogoBtn" class="mini-btn" type="button">로고 제거</button>
      </section>

      <section class="control-group grid-2">
        <label>배경 X
          <input id="bgX" type="range" min="0" max="100" value="50" />
        </label>
        <label>배경 Y
          <input id="bgY" type="range" min="0" max="100" value="50" />
        </label>
        <label>확대
          <input id="bgZoom" type="range" min="100" max="180" value="100" />
        </label>
        <label>어둡기
          <input id="overlay" type="range" min="0" max="85" value="52" />
        </label>
        <label>블러
          <input id="blur" type="range" min="0" max="12" value="0" />
        </label>
        <label>로고 크기
          <input id="logoSize" type="range" min="18" max="60" value="42" />
        </label>
      </section>

      <section class="control-group">
        <h2>기본 정보</h2>
        <label>캐치프레이즈
          <input id="tagline" type="text" value="내 인생의 행운은 전부 요리 덕에 찾아왔다" />
        </label>
        <div class="grid-3">
          <label>연도<input id="year" type="text" value="2014" /></label>
          <label>러닝타임<input id="runtime" type="text" value="1시간 54분" /></label>
          <label>화질<input id="quality" type="text" value="HD" /></label>
        </div>
        <label>추천 문구
          <input id="recommend" type="text" value="시청자 추천" />
        </label>
        <label>줄거리
          <textarea id="synopsis" rows="4">창의력이 지글지글 끓어오르는 셰프. 똑같은 메뉴만 고집하는 주인과 지지고 볶은 후 허름한 푸드트럭을 차리면서 맛깔나는 좌충우돌 여정에 오른다. 배고플 땐 보지 말 것!</textarea>
        </label>
      </section>

      <section class="control-group">
        <h2>오른쪽 정보</h2>
        <label>출연
          <input id="cast" type="text" value="존 파브로, 소피아 베르가라, 존 레귀자모" />
        </label>
        <label>장르
          <input id="genres" type="text" value="미국 작품, 코미디 영화, 인디 영화" />
        </label>
        <label>작품 특징
          <input id="features" type="text" value="힐링, 진심이 통하는, 진심 어린" />
        </label>
      </section>

      <section class="control-group">
        <h2>출력</h2>
        <div class="grid-2 compact">
          <label>비율
            <select id="ratio">
              <option value="1200x900" selected>4:3 (1200×900)</option>
              <option value="1600x900">16:9 (1600×900)</option>
              <option value="1080x1350">4:5 (1080×1350)</option>
              <option value="904x739">레퍼런스 (904×739)</option>
            </select>
          </label>
          <label>파일명
            <input id="filename" type="text" value="streaming-card" />
          </label>
        </div>
        <button id="exportBtn" class="primary-btn" type="button">PNG로 저장</button>
        <p class="hint">GitHub Pages에 올리면 그대로 작동해. 업로드한 이미지는 브라우저 안에서만 사용돼.</p>
      </section>
    </aside>

    <main class="stage-wrap">
      <div class="stage-toolbar">
        <span>실시간 미리보기</span>
        <span id="stageSizeLabel">1200 × 900</span>
      </div>
      <div class="stage-frame">
        <article id="captureCard" class="capture-card" aria-label="streaming detail card preview">
          <div id="bgLayer" class="bg-layer"></div>
          <div id="darkLayer" class="dark-layer"></div>
          <div class="edge-vignette"></div>
          <div class="bottom-fade"></div>

          <div class="top-close">×</div>

          <div class="hero-copy">
            <div id="logoPlaceholder" class="logo-placeholder">TITLE LOGO</div>
            <img id="logoPreview" class="title-logo hidden" alt="title logo" />

            <div class="action-row">
              <button class="play-btn" type="button"><span class="play-triangle"></span><span>재생</span></button>
              <button class="circle-btn" type="button">＋</button>
              <button class="circle-btn like" type="button">♡</button>
            </div>
          </div>

          <div class="tagline-wrap">
            <div id="taglineOut" class="tagline">내 인생의 행운은<br>전부 요리 덕에 찾아왔다</div>
          </div>

          <div class="meta-block">
            <div class="meta-row">
              <span id="yearOut">2014</span>
              <span id="runtimeOut">1시간 54분</span>
              <span id="qualityOut" class="quality-badge">HD</span>
            </div>

            <div class="rating-icons">
              <span class="rating-chip orange">15</span>
              <span class="rating-chip">?</span>
              <span class="rating-chip">⌁</span>
              <span class="rating-chip">♬</span>
              <span class="rating-chip">◉</span>
              <span class="rating-chip">●</span>
            </div>

            <div class="recommend-line"><span class="red-square">★</span><strong id="recommendOut">시청자 추천</strong></div>
            <p id="synopsisOut" class="synopsis"></p>
          </div>

          <div class="info-block">
            <p><span>출연:</span> <strong id="castOut"></strong></p>
            <p><span>장르:</span> <strong id="genresOut"></strong></p>
            <p><span>작품 특징:</span> <strong id="featuresOut"></strong></p>
          </div>

          <div class="sound-btn">⌁</div>
        </article>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
